                        if (customData[i][j] === 'empty' || customData[i][j] === 'blocked') {
                            newText[i][j] = customData[i][j]
                        } else if (customData[i][j] === 'interface') {
                            newText[i][j] = 'I: ' + String(z_curr._inputArray[i][j])
                        } else {
                            newText[i][j] = String(z_curr._inputArray[i][j])
                        }
                    }
                }
                setTimeout(function (){
                    Plotly.restyle(plot, {
                    'text': [newText],
                });
                }, 30);
            });
        });
    </script>
    
</body>
